[package]
name = "shadercalc"
version = "0.5.0"
edition.workspace = true
description = "ShaderCalc: HLSL worksheets checked against DXC + WARP"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shadercalc-backend = { path = "../../crates/shadercalc-backend" }
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }
